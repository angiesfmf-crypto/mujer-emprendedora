services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mujer_emprendedora
      POSTGRES_USER: mujer_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-change-me}
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mujer_app -d mujer_emprendedora"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://mujer_app:${POSTGRES_PASSWORD:-local-dev-change-me}@db:5432/mujer_emprendedora
      DATABASE_SSL: "false"
      JWT_SECRET: ${JWT_SECRET:-local-only-change-this-secret-to-at-least-32-chars}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173,http://localhost:3000}
    ports: ["3000:3000"]
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
